name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests del backend con coverage
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/TestResults:/out" \
            backend-test:ci \
            --collect:"XPlat Code Coverage"

      - name: Reporte de coverage del backend
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool

          reportgenerator \
            -reports:"TestResults/*/coverage.cobertura.xml" \
            -sourcedirs:backend \
            -targetdir:coveragereport \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-classfilters:-Program*;-MisGastos.Api.Data.*;-MisGastos.Api.Models.*;-MisGastos.Api.Migrations.*;-Microsoft.AspNetCore.OpenApi.Generated.*;-System.Runtime.CompilerServices.*OpenApiXmlCommentSupport*"

          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage y resultados del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            coveragereport
            TestResults

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/conradovolpi/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests del frontend con coverage
        run: |
          docker run --rm \
            -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" \
            frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json

          test -f "$F"

          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) {
              console.error('Se midieron 0 archivos: revisar include');
              process.exit(1);
            }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| metrica | % |');
            console.log('|---|---|');
            console.log(f('lines'));
            console.log(f('branches'));
            console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/conradovolpi/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    environment: qa

    steps:
      - name: Desplegar imagenes en QA
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-$GITHUB_SHA"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-$GITHUB_SHA"

          echo "QA backend: $IMG_API"
          echo "QA frontend: $IMG_FRONT"

          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test QA
        shell: bash
        env:
          URL_API: https://misgastos-api-qa-volpi.onrender.com
          URL_FRONT: https://misgastos-front-qa-6v5o.onrender.com
        run: |
          : "${URL_API:?Falta URL_API}"
          : "${URL_FRONT:?Falta URL_FRONT}"
          echo "Esperando que QA responda para el commit $GITHUB_SHA..."

          for i in $(seq 1 30); do
            echo "Intento $i de 30"

            if curl -fsS --max-time 10 "$URL_API/health" \
              && curl -fsS --max-time 10 "$URL_API/api/expenses" > /dev/null \
              && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
              && curl -fsS --max-time 10 "$URL_FRONT/api/expenses" > /dev/null; then
              echo "QA responde correctamente"
              exit 0
            fi

            sleep 20
          done

          echo "QA no respondio a tiempo"
          exit 1
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      API_BASE_URL: https://misgastos-api-qa-volpi.onrender.com
      E2E_BASE_URL: https://misgastos-front-qa-6v5o.onrender.com

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Probar API y base reales de QA
        run: |
          set -o pipefail
          npx playwright test --project=integracion 2>&1 | tee integracion.log

      - name: Resumen de integracion
        if: ${{ !cancelled() }}
        run: |
          echo '### Integracion contra QA' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat integracion.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de integracion
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-integracion
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 90

  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    env:
      API_BASE_URL: https://misgastos-api-qa-volpi.onrender.com
      E2E_BASE_URL: https://misgastos-front-qa-6v5o.onrender.com

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium y dependencias del sistema
        run: npx playwright install --with-deps chromium

      - name: Probar la aplicacion real de QA
        run: |
          set -o pipefail
          npx playwright test --project=e2e 2>&1 | tee e2e.log

      - name: Resumen de e2e
        if: ${{ !cancelled() }}
        run: |
          echo '### E2E contra QA' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat e2e.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 90
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    permissions: {}
    timeout-minutes: 30
    environment: production

    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Desplegar imagenes en PROD
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          case "$HOOK_API" in
            https://api.render.com/deploy/srv-db832vmq1p3s739cpto0\?*) ;;
            *) echo "RENDER_HOOK_API_PROD debe apuntar al servicio backend PROD"; exit 1 ;;
          esac

          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-$GITHUB_SHA"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-$GITHUB_SHA"

          echo "PROD backend: $IMG_API"
          echo "PROD frontend: $IMG_FRONT"

          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: ${{ vars.URL_API_PROD }}
          URL_FRONT: ${{ vars.URL_FRONT_PROD }}
        run: |
          : "${URL_API:?Falta URL_API_PROD en el environment production}"
          : "${URL_FRONT:?Falta URL_FRONT_PROD en el environment production}"
          echo "Esperando que PROD responda para el commit $GITHUB_SHA..."

          for i in $(seq 1 30); do
            echo "PROD: intento $i de 30"

            if curl -fsS --max-time 10 "$URL_API/health" &&
               curl -fsS --max-time 10 "$URL_API/api/expenses" > /dev/null &&
               curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null &&
               curl -fsS --max-time 10 "$URL_FRONT/api/expenses" > /dev/null; then
              echo "PROD responde correctamente"
              exit 0
            fi

            sleep 20
          done

          echo "PROD no respondio"
          exit 1
